<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector EPUB Accesible</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Zonas de toque gigantes para accesibilidad */
        .area-control {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid #333;
            cursor: pointer;
            user-select: none;
        }
        #btn-cargar { background-color: #2c3e50; }
        #btn-play { background-color: #27ae60; display: none; }
        #btn-pausa { background-color: #c0392b; display: none; }
        input[type="file"] { display: none; }
        #status { padding: 20px; text-align: center; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="status">Esperando un libro (Formato EPUB)</div>
    
    <label for="epub-upload" class="area-control" id="btn-cargar">
        1. Toca para cargar un libro
    </label>
    <input type="file" id="epub-upload" accept=".epub">

    <div class="area-control" id="btn-play">▶ Reproducir / Reanudar</div>
    <div class="area-control" id="btn-pausa">⏸ Pausar</div>

    <script src="app.js"></script>
</body>
</html>
